server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # El HTML no se cachea: al publicar un cambio se ve de inmediato.
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Lo que arma Astro lleva huella en el nombre: se puede cachear un año.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(svg|png|jpg|jpeg|webp|woff2|css|js)$ {
        add_header Cache-Control "public, max-age=86400";
    }

    # /politica-de-calidad sirve politica-de-calidad/index.html
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;

    gzip on;
    gzip_types text/plain text/css application/javascript image/svg+xml;
}
